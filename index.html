<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qur'an Recitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9F5;
    --surface:#FFFFFF;
    --surface-2:#F3F1E9;
    --ink:#16261C;
    --ink-soft:#5B6B60;
    --ink-faint:#94A199;
    --emerald:#0F4C3A;
    --emerald-deep:#0A362A;
    --emerald-tint:#E7EFE9;
    --gold:#AD8A4E;
    --gold-soft:#EFE3C8;
    --amber:#B4703A;
    --amber-tint:#F6E9DD;
    --line:#E7E3D6;
    --shadow: 0 1px 2px rgba(22,38,28,0.04), 0 6px 20px rgba(22,38,28,0.06);
    --radius: 18px;
    --font-display: 'Amiri', serif;
    --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C1712;
      --surface:#122019;
      --surface-2:#17251D;
      --ink:#EDF3EE;
      --ink-soft:#A9BAAF;
      --ink-faint:#6E8177;
      --emerald:#4FA080;
      --emerald-deep:#0A362A;
      --emerald-tint:#152A21;
      --gold:#D4B876;
      --gold-soft:#2A2418;
      --amber:#DB9A66;
      --amber-tint:#2B2019;
      --line:#22332A;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C1712;
    --surface:#122019;
    --surface-2:#17251D;
    --ink:#EDF3EE;
    --ink-soft:#A9BAAF;
    --ink-faint:#6E8177;
    --emerald:#4FA080;
    --emerald-deep:#0A362A;
    --emerald-tint:#152A21;
    --gold:#D4B876;
    --gold-soft:#2A2418;
    --amber:#DB9A66;
    --amber-tint:#2B2019;
    --line:#22332A;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 6px 20px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:1100px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .app-header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
  }
  .bismillah{
    font-family:var(--font-display);
    font-size:13px;
    color:var(--ink-faint);
    text-align:center;
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .header-row{
    display:flex; align-items:baseline; justify-content:space-between;
    max-width:640px; margin:0 auto;
  }
  .app-title{
    font-family:var(--font-display);
    font-size:21px; font-weight:700;
    color:var(--emerald);
    margin:0;
    letter-spacing:0.01em;
  }
  .page-label{
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .theme-toggle{
    width:32px;height:32px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;color:var(--ink-soft);padding:0;
  }
  .theme-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .theme-toggle .icon-moon{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:block;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{display:none;}
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{display:block;}
  }

  main{
    flex:1;
    padding:18px 18px 100px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .wide main{max-width:960px;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:sticky; bottom:0; z-index:20;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -2px 12px rgba(22,38,28,0.05);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:8px 2px 6px; cursor:pointer;
    color:var(--ink-faint); font-family:var(--font-body); font-size:10.5px; font-weight:600;
    border-radius:12px;
  }
  .nav-btn svg{width:21px;height:21px; stroke:var(--ink-faint); fill:none; stroke-width:1.7;}
  .nav-btn.active{color:var(--emerald);}
  .nav-btn.active svg{stroke:var(--emerald);}
  .nav-btn:active{background:var(--surface-2);}

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .section-title{
    font-size:15px; font-weight:700; color:var(--ink); margin:26px 0 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title:first-child{margin-top:0;}
  .muted{color:var(--ink-soft);}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border-radius:99px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
  }
  .pill.active{background:var(--emerald); color:#fff; border-color:var(--emerald);}
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:13.5px;
    border-radius:12px; border:none; cursor:pointer; padding:10px 16px;
  }
  .btn-primary{background:var(--emerald); color:#fff;}
  .btn-primary:active{background:var(--emerald-deep);}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-danger{background:transparent; color:#B44242; border:1px solid #E3C6C6;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .icon-btn{
    width:34px;height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); flex-shrink:0;
  }
  .icon-btn svg{width:16px;height:16px; stroke:currentColor; fill:none; stroke-width:2;}
  input[type=text], input[type=date]{
    font-family:var(--font-body); font-size:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--ink);
    width:100%;
  }
  input:focus, .pill:focus-visible, .btn:focus-visible, .nav-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Today status ---------- */
  .hero{
    background:linear-gradient(160deg, var(--emerald) 0%, var(--emerald-deep) 100%);
    border-radius:22px; padding:22px 20px; color:#fff; position:relative; overflow:hidden;
  }
  .hero .eyebrow-date{font-size:13px; color:var(--gold-soft); font-weight:600; opacity:0.9;}
  .hero-body{display:flex; align-items:center; gap:18px; margin-top:10px;}
  .ring-wrap{position:relative; width:96px; height:96px; flex-shrink:0;}
  .ring{
    width:96px; height:96px; border-radius:50%;
    background: conic-gradient(var(--gold) calc(var(--pct)*1%), rgba(255,255,255,0.18) 0);
    display:flex; align-items:center; justify-content:center;
  }
  .ring-inner{
    width:74px; height:74px; border-radius:50%; background:var(--emerald-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-inner b{font-size:20px; line-height:1;}
  .ring-inner span{font-size:9.5px; color:var(--gold-soft); margin-top:2px; letter-spacing:0.03em;}
  .hero-stats{flex:1;}
  .hero-count{font-family:var(--font-display); font-size:26px; font-weight:700;}
  .hero-count small{font-size:14px; font-weight:400; opacity:0.75;}
  .hero-sub{font-size:12.5px; color:rgba(255,255,255,0.72); margin-top:3px;}
  .khatam-banner{
    margin-top:14px; padding:9px 13px; border-radius:12px;
    background:rgba(255,255,255,0.12); font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:7px; color:var(--gold-soft);
  }
  .quote-line{
    font-family:var(--font-display); font-size:13px; font-style:italic;
    color:rgba(255,255,255,0.75); margin-top:14px; border-top:1px solid rgba(255,255,255,0.15);
    padding-top:12px;
  }
  .viewing-banner{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--gold-soft); border:1px solid var(--gold); color:var(--ink);
    border-radius:13px; padding:10px 13px; font-size:12.5px; font-weight:600; margin-top:14px;
  }
  .viewing-banner button{background:none;border:none;color:var(--emerald);font-weight:800;font-size:12.5px;cursor:pointer;}

  /* ---------- Filters ---------- */
  .filter-row{display:flex; gap:8px; align-items:center; margin-top:18px; overflow-x:auto;}
  .search-box{position:relative; margin-top:10px;}
  .search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px;height:15px; stroke:var(--ink-faint); fill:none; stroke-width:2;}
  .search-box input{padding-left:34px;}

  /* ---------- Student card ---------- */
  .student-list{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .s-card{
    display:flex; align-items:center; gap:12px; padding:13px 14px;
    border-radius:16px; border:1px solid var(--line); background:var(--surface);
  }
  .s-card.done{background:var(--emerald-tint); border-color:transparent;}
  .juz-badge{
    width:50px; height:50px; border-radius:13px; flex-shrink:0;
    background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--line);
  }
  .s-card.done .juz-badge{background:var(--emerald); border-color:var(--emerald);}
  .juz-badge b{font-size:15px; color:var(--ink); line-height:1;}
  .s-card.done .juz-badge b{color:#fff;}
  .juz-badge small{font-family:var(--font-display); font-size:11px; color:var(--gold); margin-top:1px;}
  .s-card.done .juz-badge small{color:var(--gold-soft);}
  .s-info{flex:1; min-width:0;}
  .s-name{font-size:14.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .juz-line{font-family:var(--font-display); font-size:12.5px; color:var(--gold); margin-top:1px; direction:rtl; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .s-status{font-size:12px; margin-top:2px;}
  .s-status.pending{color:var(--amber);}
  .s-status.done{color:var(--emerald);}
  .s-status.future{color:var(--ink-faint);}
  .mark-btn{
    flex-shrink:0; font-family:var(--font-body); font-weight:700; font-size:12.5px;
    border-radius:11px; border:none; padding:9px 13px; cursor:pointer; white-space:nowrap;
  }
  .mark-btn.to-mark{background:var(--emerald); color:#fff;}
  .mark-btn.undo{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .mark-btn.locked{background:var(--surface-2); color:var(--ink-faint); cursor:not-allowed;}
  .empty-state{text-align:center; padding:40px 18px; color:var(--ink-faint); font-size:13.5px;}

  /* ---------- Calendar ---------- */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-month{font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-faint); padding-bottom:4px; text-transform:uppercase;}
  .cal-cell{
    aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; position:relative;
    background:var(--surface-2); color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
  }
  .cal-cell.empty{background:none; cursor:default;}
  .cal-cell.future{color:var(--ink-faint); cursor:default; background:transparent; border:1px dashed var(--line);}
  .cal-cell.before-start{color:var(--ink-faint); cursor:default; background:transparent;}
  .cal-cell.excluded{color:var(--ink-faint); text-decoration:line-through; opacity:0.55;}
  .cal-cell.today{border:2px solid var(--gold); background:var(--gold-soft); font-weight:800;}
  .cal-cell.selected{outline:2px solid var(--emerald); outline-offset:1px;}
  .cal-cell .dot{display:none;}
  .cal-cell.full{background:var(--gold); color:#fff; border-color:transparent;}
  .cal-cell.full.today{background:var(--gold); border:2px solid var(--emerald-deep);}
  .cal-cell.partial{background:var(--emerald-tint); color:var(--emerald); border-color:transparent;}
  .cal-cell.none{background:var(--amber-tint); color:var(--amber); border-color:transparent;}
  .cal-legend{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft);}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .stat-box{padding:15px; border-radius:15px; background:var(--surface); border:1px solid var(--line);}
  .stat-box b{font-family:var(--font-display); font-size:22px; display:block; color:var(--emerald);}
  .stat-box span{font-size:11.5px; color:var(--ink-soft);}
  table.s-table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  table.s-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); padding:6px 8px; border-bottom:1px solid var(--line);}
  table.s-table td{padding:9px 8px; border-bottom:1px solid var(--line); color:var(--ink);}
  .table-wrap{overflow-x:auto; border-radius:14px; border:1px solid var(--line);}
  .rate-bar{width:60px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px;}
  .rate-bar i{display:block; height:100%; background:var(--emerald);}
  .khatam-row{display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .khatam-row:last-child{border-bottom:none;}

  /* ---------- Students view ---------- */
  .students-grid{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  .stu-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:15px; border:1px solid var(--line); background:var(--surface); cursor:pointer;}
  .avatar{width:40px;height:40px;border-radius:50%; background:var(--emerald-tint); color:var(--emerald); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;}
  .stu-meta{flex:1; min-width:0;}
  .stu-meta b{font-size:14px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stu-meta span{font-size:11.5px; color:var(--ink-soft);}
  .chev{width:16px;height:16px; stroke:var(--ink-faint); fill:none; stroke-width:2; flex-shrink:0;}

  .detail-header{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .back-btn{background:none;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);padding:4px;}
  .back-btn svg{width:20px;height:20px; stroke:currentColor; fill:none; stroke-width:2;}
  .hist-row{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-status{font-weight:700; font-size:12px;}
  .hist-status.done{color:var(--emerald);}
  .hist-status.miss{color:var(--amber);}
  .hist-status.future{color:var(--ink-faint);}

  /* ---------- Admin ---------- */
  .admin-block{margin-bottom:26px;}
  .admin-block h4{font-size:13.5px; margin:0 0 4px; color:var(--ink);}
  .admin-block p.hint{font-size:12px; color:var(--ink-soft); margin:0 0 12px;}
  .admin-row{display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line);}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .order-no{width:22px;font-size:12px;color:var(--ink-faint);font-weight:700;flex-shrink:0;}
  .admin-row input[type=text]{flex:1; padding:7px 10px; font-size:13.5px;}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .warn-box{background:var(--amber-tint); color:var(--amber); border-radius:11px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:12px;}

  .ar{font-family:var(--font-display); font-weight:700;}
  .wa-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid #BFE3CE;background:#E9F7EF;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .wa-btn svg{width:17px;height:17px;fill:#1E9E56;}
  .login-wrap{max-width:340px;margin:30px auto 0;text-align:center;}
  .login-wrap h3{font-family:var(--font-display);font-size:19px;color:var(--emerald);margin:10px 0 4px;}
  .login-wrap p.hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
  .login-field{margin-bottom:10px;text-align:left;}
  .login-field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .login-error{color:#B44242;font-size:12.5px;font-weight:600;margin-top:8px;}
  .admin-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .logout-link{background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:700;cursor:pointer;}

  /* ---------- Members (new) ---------- */
  .m-input{
    font-family:var(--font-body); font-size:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--ink);
    width:100%;
  }
  textarea.m-input{resize:vertical; min-height:64px;}
  select.m-input{appearance:auto;}
  .m-input:focus{outline:2px solid var(--gold); outline-offset:2px;}
  .m-hero-row{display:flex; align-items:center; gap:16px; margin-top:12px;}
  .m-bigjuz{
    width:84px; height:84px; border-radius:22px; flex-shrink:0;
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.22);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .m-bigjuz b{font-size:34px; line-height:1;}
  .m-bigjuz span{font-size:9.5px; letter-spacing:0.12em; color:var(--gold-soft); margin-top:5px;}
  .m-hero-info{flex:1; min-width:0;}
  .m-juz-ar{font-family:var(--font-display); font-size:26px; font-weight:700; direction:rtl; text-align:left; line-height:1.3;}
  .m-hero-btn{
    margin-top:16px; width:100%; border:none; border-radius:13px; padding:12px;
    font-family:var(--font-body); font-weight:800; font-size:14px; cursor:pointer;
    background:#fff; color:var(--emerald-deep);
  }
  .m-hero-btn.undo{background:rgba(255,255,255,0.14); color:#fff; border:1px solid rgba(255,255,255,0.3);}
  .m-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px;}
  .m-tile{
    aspect-ratio:1; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    font-family:var(--font-body); font-weight:700; font-size:14px; cursor:pointer; position:relative; padding:0;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .m-tile.done{background:var(--emerald); color:#fff; border-color:var(--emerald);}
  .m-tile.today{background:var(--gold-soft);}
  .m-tile.missed{background:var(--amber-tint); color:var(--amber); border-color:transparent;}
  .m-tile.future{background:transparent; border:1px dashed var(--line); color:var(--ink-faint);}
  .m-tile.off{opacity:0.5; text-decoration:line-through; background:transparent;}
  .m-tile.istoday{border:2px solid var(--gold);}
  .m-tile.sel{outline:2px solid var(--emerald); outline-offset:1px;}
  .m-tile .tick{position:absolute; top:3px; right:5px; font-size:9px; font-style:normal; opacity:0.9;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, writeBatch, runTransaction, getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6xqNX-oTPoraliwDnnRZRcRI3MCUzjOg",
  authDomain: "quran-recitation-64d5d.firebaseapp.com",
  projectId: "quran-recitation-64d5d",
  storageBucket: "quran-recitation-64d5d.firebasestorage.app",
  messagingSenderId: "1001521311583",
  appId: "1:1001521311583:web:197c9aee9102e9a52010ea"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

(function(){
  "use strict";

  /* ================= STORAGE (Firebase Firestore, real-time) ================= */
  var DEFAULT_STUDENTS = [
    ["Ishaq","9995127252"],["Swalih Kakkad","8547570114"],["Shibli Mannarkkad","7306201432"],
    ["Niyas Vellamunda","8075940968"],["Swadiq Kodoor","7994228335"],["Thameem","9497178003"],
    ["Sinan Kallikkandi","9061882663"],["Swalih Vanimel","917592893817"],["Mihras Orkkatteri","7594896719"],
    ["Adnan Mahi","9605524265"],["Swalih Pullukkara","7034115688"],["Ismail Elankoor","9207519687"],
    ["Ismail Pullukkara","9562337706"],["Mansoor Vennakkode","9946747819"],["Fasal Kavannoor","8943137993"],
    ["Hashim Khalid","9947301602"],["Ashkar Parakkadavu","8089903399"],["Shafeeh Thiruvallur","7736575021"],
    ["Sajjad Parakkadavu","8111925352"],["Musthafa Parakkadavu","7594013963"],["Muhammed NK","9496213242"],
    ["Muhammed VTK","9846917028"],["Aslah Vanimel","7736743363"],["Munavvar Theekkuni","6282143487"],
    ["Shafi Nandi","9747886653"],["Shanid Valliyad","9539759521"],["Muhammed EU","9074596648"],
    ["Asim","8590771931"],["Fajran","7594020247"],["Munavvir TP","9447408371"]
  ];

  var studentsRaw = []; // every student doc exactly as stored in Firestore (may contain duplicates)
  var aliasIds = {};    // canonicalId -> [duplicate ids with the same name]
  var students = [];   // array of {id, name, phone, order} kept sorted by order — synced from Firestore
  var records  = {};   // key `${date}_${studentId}` -> {completed, completedAt} — synced from Firestore
  var settings = { baseDate: dateToStrEarly(), baseJuz: 1, programStart: dateToStrEarly(), adminId: '', adminPassword: '', excludedDates: [], turnSwaps: [], dedupV2Done: false };

  function dateToStrEarly(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  var dataReady = { students:false, records:false, settings:false };
  var seededStudents = false, seededSettings = false;
  var serverSynced = { students:false, records:false, settings:false }; // true once real server data (not stale cache) has arrived
  var fbErrorShown = false;

  function fbFail(label){
    return function(err){
      console.error(label, err);
      if(!fbErrorShown){
        fbErrorShown = true;
        content.innerHTML = '<div class="empty-state" style="padding-top:60px;">Could not connect to the database.<br>Check your internet connection and Firebase setup, then reload.</div>';
      }
    };
  }

  function maybeFirstRender(){
    if(dataReady.students && dataReady.records && dataReady.settings){
      render();
    }
  }

  onSnapshot(collection(db, 'students'), function(snap){
    if(snap.empty && snap.metadata.fromCache){ return; } // empty cache != empty database — never seed from it
    if(snap.empty && !seededStudents){
      seededStudents = true;
      var batch = writeBatch(db);
      DEFAULT_STUDENTS.forEach(function(pair, i){
        var ref = doc(db, 'students', 'seed_' + i); // fixed id: seeding twice can never create duplicates
        batch.set(ref, { name:pair[0], phone:pair[1], order:i });
      });
      batch.commit().catch(fbFail('seed students'));
      return; // the write above triggers another snapshot with real data
    }
    var arr = [];
    snap.forEach(function(d){
      var v = d.data();
      arr.push({ id: d.id, name: v.name||'', phone: v.phone||'', order: (v.order!==undefined ? v.order : 0) });
    });
    arr.sort(function(a,b){ return a.order - b.order; });
    studentsRaw = arr;
    rebuildStudentsView();
    if(!snap.metadata.fromCache) serverSynced.students = true;
    dataReady.students = true;
    maybeRunMigrations();
    maybeFirstRender();
    if(dataReady.students && dataReady.records && dataReady.settings) render();
  }, fbFail('students'));


  /* The screen ALWAYS works on one student per name. Even if Firestore holds duplicate
     docs (60 instead of 30), the app shows and counts only 30 until the cleanup removes them. */
  function rebuildStudentsView(){
    var swapIds = {};
    ((settings && settings.turnSwaps) || []).forEach(function(sw){ (sw.changes||[]).forEach(function(ch){ swapIds[ch.id] = 1; }); });
    function doneCount(id){
      var c = 0, suffix = '_' + id;
      Object.keys(records).forEach(function(k){ if(records[k].completed && k.slice(-suffix.length) === suffix) c++; });
      return c;
    }
    var groups = {}, names = [];
    studentsRaw.forEach(function(st){ if(!groups[st.name]){ groups[st.name] = []; names.push(st.name); } groups[st.name].push(st); });
    var out = [], alias = {};
    names.forEach(function(n){
      var g = groups[n].slice();
      if(g.length > 1){
        g.sort(function(a,b){
          var sa = swapIds[a.id] ? 1 : 0, sb = swapIds[b.id] ? 1 : 0;
          if(sa !== sb) return sb - sa;
          var d = doneCount(b.id) - doneCount(a.id);
          if(d) return d;
          return a.id < b.id ? -1 : 1;
        });
      }
      out.push(g[0]);
      alias[g[0].id] = g.slice(1).map(function(x){ return x.id; });
    });
    out.sort(function(a,b){ return a.order - b.order; });
    aliasIds = alias;
    students = out;
  }

  var migrationsChecked = false;
  function maybeRunMigrations(){
    if(!dataReady.students || !dataReady.records || !dataReady.settings) return;
    if(!serverSynced.students || !serverSynced.records || !serverSynced.settings) return; // never migrate from stale cache
    if(!migrationsChecked){
      migrationsChecked = true;
      if(maybeDedupStudents()) return; // writes pending — fresh snapshots will re-trigger this
    }
    maybeRunTurnSwapMigration();
  }

  /* One-time cleanup: if students got double-seeded (duplicate name entries),
     merge their records onto one doc per name, delete the duplicates, and
     reset order + turn-swap history to a clean baseline. */
  function maybeDedupStudents(forceLight){
    var lightMode = !!forceLight || !!settings.dedupV2Done; // cleanup already ran before: only merge duplicates, keep order + swap history untouched
    var byName = {};
    studentsRaw.forEach(function(s){ (byName[s.name] = byName[s.name] || []).push(s); });
    var dupNames = Object.keys(byName).filter(function(n){ return byName[n].length>1; });
    if(dupNames.length===0){
      if(!settings.dedupV2Done){
        settings.dedupV2Done = true;
        setDoc(doc(db,'settings','main'), { dedupV2Done:true }, { merge:true }).catch(function(e){ console.error(e); });
      }
      return false;
    }
    var defaultIndexByName = {};
    DEFAULT_STUDENTS.forEach(function(pair,i){ defaultIndexByName[pair[0]] = i; });

    var ops = []; // {type:'set'|'delete'|'update', ref, data}
    dupNames.forEach(function(name){
      var group = byName[name].slice();
      function completedCount(sid){
        var c = 0;
        Object.keys(records).forEach(function(k){ if(k.slice(-(sid.length+1))==='_'+sid && records[k].completed) c++; });
        return c;
      }
      group.sort(function(a,b){ return completedCount(b.id) - completedCount(a.id); });
      var primary = group[0];
      for(var i=1;i<group.length;i++){
        var dup = group[i];
        Object.keys(records).forEach(function(k){
          if(k.slice(-(dup.id.length+1)) !== '_'+dup.id) return;
          var dateStr = k.slice(0, k.length - (dup.id.length+1));
          var primKey = dateStr + '_' + primary.id;
          var dupRec = records[k];
          var primRec = records[primKey];
          if(!primRec || (!primRec.completed && dupRec.completed)){
            ops.push({ type:'set', ref: doc(db,'records', primKey), data: { date:dateStr, studentId:primary.id, completed:!!dupRec.completed, completedAt: dupRec.completedAt||null } });
          }
          ops.push({ type:'delete', ref: doc(db,'records', k) });
        });
        ops.push({ type:'delete', ref: doc(db,'students', dup.id) });
      }
      if(!lightMode && defaultIndexByName[name] !== undefined){
        ops.push({ type:'update', ref: doc(db,'students',primary.id), data: { order: defaultIndexByName[name] } });
      }
    });
    if(!lightMode){
      ops.push({ type:'set', ref: doc(db,'settings','main'), data: { turnSwaps: [], dedupV2Done:true }, merge:true });
      settings.turnSwaps = [];
      settings.dedupV2Done = true;
    }
    commitOpsInChunks(ops, 400).catch(function(e){ console.error('dedup failed', e); alert('Cleanup failed — check your internet connection and reopen the app.'); });
    return true;
  }

  function fixDuplicateStudents(){
    if(!serverSynced.students || !serverSynced.records){ alert('Still loading from the server. Wait a few seconds and try again.'); return; }
    var extra = studentsRaw.length - students.length;
    if(extra <= 0){ alert('All good: ' + studentsRaw.length + ' students in the database, no duplicates.'); return; }
    if(!confirm(extra + ' duplicate student entries found (' + studentsRaw.length + ' in the database, ' + students.length + ' real students).\n\nMerge them? All completed records are kept.')) return;
    var started = maybeDedupStudents(true);
    alert(started ? 'Cleaning up. This takes a few seconds, the count will become ' + students.length + '.' : 'Nothing to clean up.');
  }

  function commitOpsInChunks(ops, chunkSize){
    var chunks = [];
    for(var i=0;i<ops.length;i+=chunkSize){ chunks.push(ops.slice(i, i+chunkSize)); }
    var p = Promise.resolve();
    chunks.forEach(function(chunk){
      p = p.then(function(){
        var batch = writeBatch(db);
        chunk.forEach(function(op){
          if(op.type==='set') batch.set(op.ref, op.data, op.merge ? {merge:true} : undefined);
          else if(op.type==='update') batch.update(op.ref, op.data);
          else if(op.type==='delete') batch.delete(op.ref);
        });
        return batch.commit();
      });
    });
    return p;
  }

  function maybeRunTurnSwapMigration(){
    scheduleTurnSwap('Shanid Valliyad', 25, 'Swadiq Kodoor', 4);
  }
  function scheduleTurnSwap(nameA, origOrderA, nameB, origOrderB){
    var a = students.find(function(s){ return s.name===nameA; });
    var b = students.find(function(s){ return s.name===nameB; });
    if(!a || !b) return;
    if(a.order!==origOrderA || b.order!==origOrderB) return; // already swapped, or data changed — skip
    var alreadyLogged = (settings.turnSwaps||[]).some(function(sw){ return (sw.changes||[]).some(function(ch){ return ch.id===a.id || ch.id===b.id; }); });
    if(alreadyLogged) return; // this swap is already recorded — never log it twice
    var eff = todayStr();
    var swapRec = { date: eff, changes: [ {id:a.id, from:origOrderA, to:origOrderB}, {id:b.id, from:origOrderB, to:origOrderA} ] };
    var newSwaps = (settings.turnSwaps||[]).concat([swapRec]);
    var batch = writeBatch(db);
    batch.update(doc(db,'students',a.id), { order: origOrderB });
    batch.update(doc(db,'students',b.id), { order: origOrderA });
    batch.commit().catch(function(e){ console.error('swap turns', e); });
    settings.turnSwaps = newSwaps;
    setDoc(doc(db,'settings','main'), { turnSwaps: newSwaps }, { merge:true }).catch(function(e){ console.error('save turnSwaps', e); });
  }

  onSnapshot(doc(db, 'settings', 'main'), function(snap){
    if(snap.exists()){
      var v = snap.data();
      settings.baseDate = v.baseDate || v.startDate || dateToStrEarly();
      settings.baseJuz = v.baseJuz || 1;
      settings.programStart = v.programStart || v.startDate || null; // null = unknown, repaired below once records are loaded
      settings.adminId = v.adminId || '';
      settings.adminPassword = v.adminPassword || '';
      settings.excludedDates = v.excludedDates || [];
      settings.turnSwaps = v.turnSwaps || [];
      settings.dedupV2Done = !!v.dedupV2Done;
    } else if(!seededSettings && !snap.metadata.fromCache){ // cache-only 'missing' must never reset baseDate/baseJuz/admin/swaps
      seededSettings = true;
      setDoc(doc(db,'settings','main'), { baseDate: dateToStrEarly(), baseJuz: 1, programStart: dateToStrEarly(), adminId:'', adminPassword:'', excludedDates: [], turnSwaps: [], dedupV2Done:false }, { merge:true }).catch(fbFail('seed settings'));
    }
    if(!snap.metadata.fromCache) serverSynced.settings = true;
    dataReady.settings = true;
    maybeRunMigrations();
    maybeFixProgramStart();
    maybeFirstRender();
  }, fbFail('settings'));

  /* If programStart is missing from Firestore (e.g. an old doc from before this
     field existed), recover it from the earliest existing recitation record
     instead of silently defaulting to today — which would hide real history. */
  var programStartFixed = false;
  function maybeFixProgramStart(){
    if(programStartFixed) return;
    if(!dataReady.records || !dataReady.settings) return;
    programStartFixed = true;
    var earliest = null;
    Object.keys(records).forEach(function(k){
      var dateStr = k.slice(0, 10);
      if(/^\d{4}-\d{2}-\d{2}$/.test(dateStr) && (!earliest || dateStr < earliest)) earliest = dateStr;
    });
    // start date already set and nothing older exists in records -> leave as is.
    // start date later than the earliest record (e.g. it got reset) -> move it back so no history is hidden.
    if(settings.programStart && !(earliest && earliest < settings.programStart)) return;
    var ps = earliest || todayStr();
    settings.programStart = ps;
    setDoc(doc(db,'settings','main'), { programStart: ps }, { merge:true }).catch(function(e){ console.error('fix programStart', e); });
    render();
  }

  onSnapshot(collection(db, 'records'), function(snap){
    var map = {};
    snap.forEach(function(d){
      var v = d.data();
      map[d.id] = { completed: !!v.completed, completedAt: v.completedAt || null };
    });
    records = map;
    if(!snap.metadata.fromCache) serverSynced.records = true;
    dataReady.records = true;
    maybeRunMigrations();
    maybeFixProgramStart();
    maybeFirstRender();
  }, fbFail('records'));

  function setCompleted(dateStr, studentId, completed){
    var key = recordKey(dateStr, studentId);
    records[key] = completed ? { completed:true, completedAt: Date.now() } : { completed:false, completedAt:null };
    render(); // optimistic — onSnapshot will reconcile moments later
    var payload = completed
      ? { date:dateStr, studentId:studentId, completed:true, completedAt: Date.now() }
      : { date:dateStr, studentId:studentId, completed:false, completedAt:null };
    setDoc(doc(db, 'records', key), payload).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
  }
  function saveStudentPhone(id, phone){
    var s = students.find(function(x){ return x.id===id; });
    if(s) s.phone = phone;
    updateDoc(doc(db, 'students', id), { phone: phone }).catch(function(e){ console.error(e); });
  }
  function saveBaseJuz(juzNum){
    settings.baseDate = todayStr();
    settings.baseJuz = juzNum;
    render();
    setDoc(doc(db,'settings','main'), { baseDate: settings.baseDate, baseJuz: juzNum }, { merge:true }).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
  }
  function saveProgramStart(dateStr){
    settings.programStart = dateStr;
    programStartFixed = true;
    render();
    setDoc(doc(db,'settings','main'), { programStart: dateStr }, { merge:true }).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
  }
  function saveAdminCreds(id, pass){
    settings.adminId = id; settings.adminPassword = pass;
    setDoc(doc(db,'settings','main'), { adminId:id, adminPassword:pass }, { merge:true }).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
  }

  /* ================= DATE HELPERS ================= */
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateToStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function strToDate(s){ var p=s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function todayStr(){ return dateToStr(today()); }
  function daysBetween(a,b){ return Math.round((strToDate(b) - strToDate(a)) / 86400000); }
  function addDays(dateStr, n){ var d=strToDate(dateStr); d.setDate(d.getDate()+n); return dateToStr(d); }
  function fmtLong(dateStr){
    var d = strToDate(dateStr);
    var dow=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    var mo=['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()];
    return dow+', '+d.getDate()+' '+mo+' '+d.getFullYear();
  }
  function fmtShort(dateStr){
    var d = strToDate(dateStr);
    var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    return d.getDate()+' '+mo+' '+d.getFullYear();
  }
  function fmtTime(ts){
    var d = new Date(ts);
    var h = d.getHours(), m = pad(d.getMinutes());
    var ap = h>=12 ? 'PM':'AM'; var h12 = h%12; if(h12===0) h12=12;
    return h12+':'+m+' '+ap;
  }
  var ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function toArabicNum(n){ return String(n).split('').map(function(c){ return ARABIC_DIGITS[+c] !== undefined ? ARABIC_DIGITS[+c] : c; }).join(''); }

  var JUZ_NAMES = [
    "الم","سَيَقُولُ","تِلْكَ الرُّسُلُ","لَنْ تَنَالُوا","وَالْمُحْصَنَاتُ",
    "لَا يُحِبُّ اللَّهُ","وَإِذَا سَمِعُوا","وَلَوْ أَنَّنَا","قَالَ الْمَلَأُ","وَاعْلَمُوا",
    "يَعْتَذِرُونَ","وَمَا مِنْ دَابَّةٍ","وَمَا أُبَرِّئُ","رُبَمَا","سُبْحَانَ الَّذِي",
    "قَالَ أَلَمْ","اقْتَرَبَ لِلنَّاسِ","قَدْ أَفْلَحَ","وَقَالَ الَّذِينَ","فَمَا كَانَ",

  ];
  function juzName(n){ return JUZ_NAMES[n-1] || ''; }

  /* ================= ROTATION LOGIC ================= */
  function rosterSize(){
    var seen = {}, c = 0;
    students.forEach(function(s){ if(!seen[s.name]){ seen[s.name] = 1; c++; } });
    return c || 30;
  }
  function dayOffsetFor(dateStr){
    var raw = daysBetween(settings.baseDate, dateStr);
    var n = rosterSize();
    return (((settings.baseJuz - 1) + raw) % n + n) % n;
  }
  function juzForPosition(position, dateStr){
    var n = rosterSize();
    var offset = dayOffsetFor(dateStr);
    return ((position + offset) % n) + 1;
  }
  function isFuture(dateStr){ return dateStr > todayStr(); }
  function isBeforeStart(dateStr){ return false; }
  function isExcluded(dateStr){ return (settings.excludedDates||[]).indexOf(dateStr) > -1; }
  function excludeDate(dateStr){
    if(isExcluded(dateStr)) return;
    settings.excludedDates = (settings.excludedDates||[]).concat([dateStr]);
    var batch = writeBatch(db);
    studentsRaw.forEach(function(s){
      var rid = dateStr + '_' + s.id;
      delete records[rid];
      batch.delete(doc(db,'records',rid));
    });
    batch.commit().catch(function(e){ console.error(e); });
    setDoc(doc(db,'settings','main'), { excludedDates: settings.excludedDates }, { merge:true }).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
    render();
  }
  function restoreDate(dateStr){
    settings.excludedDates = (settings.excludedDates||[]).filter(function(d){ return d!==dateStr; });
    setDoc(doc(db,'settings','main'), { excludedDates: settings.excludedDates }, { merge:true }).catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
    render();
  }

  function recordKey(dateStr, studentId){ return dateStr+'_'+studentId; }
  function getRecord(dateStr, studentId){
    var best = records[recordKey(dateStr, studentId)] || null;
    (aliasIds[studentId] || []).forEach(function(aid){
      var r = records[recordKey(dateStr, aid)];
      if(r && (!best || (!best.completed && r.completed))) best = r;
    });
    return best || {completed:false, completedAt:null};
  }

  /* Reconstructs each student's rotation order as it stood on a given date,
     so a turn-swap only affects today onward and past history stays accurate. */
  function effectiveOrder(student, dateStr){
    var ord = student.order;
    var swaps = settings.turnSwaps || [];
    for(var i=swaps.length-1; i>=0; i--){
      var sw = swaps[i];
      if(dateStr < sw.date){
        sw.changes.forEach(function(ch){ if(ch.id===student.id || (aliasIds[student.id]||[]).indexOf(ch.id)>-1) ord = ch.from; });
      }
    }
    return ord;
  }
  function orderedStudentsForDate(dateStr){
    var arr = students.map(function(s){ return { s:s, ord: effectiveOrder(s, dateStr) }; });
    arr.sort(function(a,b){ return a.ord - b.ord; });
    return arr.map(function(x){ return x.s; });
  }
  function positionOnDate(studentId, dateStr){
    return orderedStudentsForDate(dateStr).findIndex(function(s){ return s.id===studentId; });
  }

  function dayAssignments(dateStr){
    return orderedStudentsForDate(dateStr).map(function(stu, idx){
      var rec = getRecord(dateStr, stu.id);
      return { student:stu, position:idx, juz: juzForPosition(idx, dateStr), completed:rec.completed, completedAt:rec.completedAt };
    });
  }
  function daySummary(dateStr){
    var list = dayAssignments(dateStr);
    var completed = list.filter(function(a){ return a.completed; });
    var total = list.length;
    return {
      total: total,
      completed: completed.length,
      pending: total - completed.length,
      pct: total ? Math.round(completed.length/total*100) : 0,
      pendingList: list.filter(function(a){ return !a.completed; }),
      khatam: total>0 && completed.length===total
    };
  }

  /* ---------- STATS ---------- */
  function renderStats(){
    var start = settings.programStart || todayStr();
    var end = todayStr();
    var totalDays = Math.max(0, daysBetween(start, end) + 1);
    var n = students.length;
    var totalCompleted = 0;
    var khatamDays = 0;
    var khatamHistory = [];
    var perStudent = {};
    var countedDays = 0;
    students.forEach(function(s){ perStudent[s.id] = {name:s.name, completed:0, total:0}; });

    for(var i=0;i<totalDays;i++){
      var d = addDays(start, i);
      if(isExcluded(d)) continue;
      countedDays++;
      var sum = daySummary(d);
      totalCompleted += sum.completed;
      if(sum.khatam) khatamDays++;
      khatamHistory.push({date:d, completed:sum.completed, total:sum.total, khatam:sum.khatam});
      dayAssignments(d).forEach(function(a){
        if(perStudent[a.student.id]){
          perStudent[a.student.id].total++;
          if(a.completed) perStudent[a.student.id].completed++;
        }
      });
    }
    khatamHistory.reverse();
    var totalScheduled = countedDays * n;
    var overallPct = totalScheduled ? Math.round(totalCompleted/totalScheduled*100) : 0;

    var html = '';
    html += '<div class="stat-grid">';
    html += '<div class="stat-box"><b>'+n+'</b><span>Students</span></div>';

  /* =====================================================================
     MEMBERS — self-registration + personal 30-Juz tracker (new section)
     Separate Firestore collections (`members`, `memberRecords`) so the
     existing students / rotation / statistics are never touched.
     ===================================================================== */
  var members = [];        // {id,name,phone,details,salt,pwHash,startDate,anchors:[{date,juz}],createdAt}
  var memberRecs = {};     // `${date}_${memberId}` -> {completed, completedAt}
  var membersReady = { members:false, recs:false };
  var membersError = '';   // '' | 'permission' | 'network'
  var lastFormKey = null, forceRender = false;

  function loadMemberAuthed(){ try{ return localStorage.getItem('qr_member_authed_v1') || null; }catch(e){ return null; } }
  function saveMemberAuthed(id){ try{ if(id){ localStorage.setItem('qr_member_authed_v1', id); } else { localStorage.removeItem('qr_member_authed_v1'); } }catch(e){} }

  function renderNow(){ forceRender = true; try{ render(); } finally { forceRender = false; } }
  function renderIfReady(){ if(dataReady.students && dataReady.records && dataReady.settings) render(); }
  function renderMembersIfVisible(){ if(state.view==='members') renderIfReady(); }

  function normAnchors(raw, startDate){
    var out = [];
    if(Array.isArray(raw)){
      raw.forEach(function(a){
        if(a && /^\d{4}-\d{2}-\d{2}$/.test(a.date||'') && a.juz>=1 && a.juz<=30) out.push({ date:a.date, juz:+a.juz });
      });
    }
    out.sort(function(a,b){ return a.date<b.date ? -1 : (a.date>b.date ? 1 : 0); });
    if(!out.length) out.push({ date: startDate || todayStr(), juz: 1 });
    return out;
  }

  function membersListenError(label){
    return function(err){
      console.error(label, err);
      membersError = (err && err.code==='permission-denied') ? 'permission' : 'network';
      renderMembersIfVisible();
    };
  }

  onSnapshot(collection(db, 'members'), function(snap){
    var arr = [];
    snap.forEach(function(d){
      var v = d.data();
      var sd = v.startDate || todayStr();
      arr.push({ id:d.id, name:v.name||'', phone:v.phone||'', details:v.details||'', salt:v.salt||'', pwHash:v.pwHash||'',
                 startDate:sd, anchors:normAnchors(v.anchors, sd), createdAt:v.createdAt||0 });
    });
    arr.sort(function(a,b){ return a.createdAt - b.createdAt; });
    members = arr;
    membersReady.members = true;
    membersError = '';
    if(!snap.metadata.fromCache && state.memberAuthed && !getMember(state.memberAuthed)){
      state.memberAuthed = null; saveMemberAuthed(null); // account was removed by admin
    }
    renderMembersIfVisible();
  }, membersListenError('members'));

  onSnapshot(collection(db, 'memberRecords'), function(snap){
    var map = {};
    snap.forEach(function(d){
      var v = d.data();
      map[d.id] = { completed: !!v.completed, completedAt: v.completedAt || null };
    });
    memberRecs = map;
    membersReady.recs = true;
    renderMembersIfVisible();
  }, membersListenError('memberRecords'));

  /* ---------- helpers ---------- */
  function getMember(id){ return members.find(function(m){ return m.id===id; }) || null; }
  function escA(s){ return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function nameKey(n){ return (n||'').trim().replace(/\s+/g,' ').toLowerCase(); }
  function nameTaken(name, exceptId){
    var k = nameKey(name);
    return members.some(function(m){ return m.id!==exceptId && nameKey(m.name)===k; });
  }
  function mWaBtn(m, juz){
    var href = m.phone ? waLink(m.phone, m.name, juz) : null;
    if(!href) return '';
    return '<a class="wa-btn" href="'+href+'" target="_blank" rel="noopener" title="Send today\u2019s Juz on WhatsApp"><svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.4.7 4.7 1.9 6.7L3 29l7-1.9c1.9 1 4 1.6 6 1.6 7 0 12.7-5.6 12.7-12.5S23 3 16 3zm0 22.7c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.2 1.1 1.1-4-.2-.4a10.3 10.3 0 0 1-1.6-5.5c0-5.8 4.8-10.5 10.6-10.5s10.6 4.7 10.6 10.5S21.8 25.7 16 25.7zm5.8-7.9c-.3-.2-1.9-.9-2.1-1-.3-.1-.5-.2-.7.1-.2.3-.8 1-1 1.2-.2.2-.4.3-.7.1-.3-.2-1.4-.5-2.7-1.6-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.7-1-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.9-.8 2.1-1.5.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.4z"/></svg></a>';
  }
  function mInitials(name){ return name.split(' ').map(function(w){ return w.charAt(0); }).slice(0,2).join('').toUpperCase(); }

  function randSalt(){
    var a = new Uint8Array(12);
    if(window.crypto && crypto.getRandomValues){ crypto.getRandomValues(a); }
    else { for(var i=0;i<a.length;i++) a[i] = Math.floor(Math.random()*256); }
    return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  }
  function hashPw(pw, salt){
    try{
      if(window.crypto && crypto.subtle && window.TextEncoder){
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pw)).then(function(buf){
          return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
        });
      }
    }catch(e){}
    return Promise.resolve('plain:'+pw);
  }

  /* ---------- rotation (per member) ---------- */
  // Every member has all 30 Juz, rotating +1 every day from an "anchor" (date + Juz) set by the admin.
  function memberJuzOn(m, dateStr){
    if(dateStr < m.startDate) return null;
    var a = m.anchors[0];
    for(var i=0;i<m.anchors.length;i++){ if(m.anchors[i].date <= dateStr) a = m.anchors[i]; else break; }
    return ((((a.juz-1) + daysBetween(a.date, dateStr)) % 30) + 30) % 30 + 1;
  }
  function memberRec(id, dateStr){ return memberRecs[dateStr+'_'+id] || { completed:false, completedAt:null }; }
  function memberDayList(dateStr){
    return members.filter(function(m){ return m.startDate <= dateStr; }).map(function(m){
      var r = memberRec(m.id, dateStr);
      return { member:m, juz:memberJuzOn(m, dateStr), completed:r.completed, completedAt:r.completedAt };
    });
  }
  function memberStats(m){
    var t = todayStr(), days = daysBetween(m.startDate, t) + 1, total = 0, done = 0, i, d;
    for(i=0;i<days;i++){
      d = addDays(m.startDate, i);
      if(isExcluded(d)) continue;
      total++;
      if(memberRec(m.id, d).completed) done++;
    }
    var streak = 0;
    for(i=0;i<days;i++){
      d = addDays(t, -i);
      if(isExcluded(d)) continue;
      if(memberRec(m.id, d).completed) streak++;
      else if(i===0) continue;   // today still pending: don't break the streak yet
      else break;
    }
    var pendingToday = (!isExcluded(t) && !memberRec(m.id, t).completed) ? 1 : 0;
    return { total:total, done:done, missed: Math.max(0, total - done - pendingToday), rate: total ? Math.round(done/total*100) : 0, streak:streak };
  }
  // For each of the 30 Juz: the most recent day it was due (or the next day it will be).
  function memberJuzMap(m){
    var map = {}, t = todayStr(), i, d, j;
    for(i=0;i<30;i++){
      d = addDays(t, -i);
      if(d < m.startDate) break;
      j = memberJuzOn(m, d);
      if(!map[j]) map[j] = { date:d, kind: i===0 ? 'today' : 'past' };
    }
    for(i=1;i<=30;i++){
      d = addDays(t, i);
      j = memberJuzOn(m, d);
      if(!map[j]) map[j] = { date:d, kind:'future' };
    }
    return map;
  }

  function setMemberDone(dateStr, id, done){
    if(isExcluded(dateStr) || isFuture(dateStr)) return;
    var key = dateStr+'_'+id, now = Date.now();
    memberRecs[key] = done ? { completed:true, completedAt:now } : { completed:false, completedAt:null };
    renderNow(); // optimistic — onSnapshot reconciles moments later
    setDoc(doc(db,'memberRecords',key), { date:dateStr, memberId:id, completed:!!done, completedAt: done ? now : null })
      .catch(function(e){ console.error(e); alert('Could not save — check your internet connection.'); });
  }

  /* ---------- screens ---------- */
  // Form screens must never be wiped by background Firestore refreshes while someone is typing.
  function memberFormKey(){
    if(state.view!=='members') return null;
    if(state.adminAuthed){
      if(state.memberEditId && getMember(state.memberEditId)) return 'edit:'+state.memberEditId;
      if(state.memberMode==='register') return 'register-admin';
      return null;
    }
    if(state.memberAuthed && getMember(state.memberAuthed)) return null;
    if(state.memberMode==='register') return 'register';
    if(state.memberMode==='login') return 'login';
    return null;
  }

  function renderMembers(){
    if(membersError==='permission'){
      return '<div class="empty-state" style="padding-top:50px;"><b style="color:var(--ink);">Members database is not allowed yet.</b><br><br>In Firebase console \u2192 Firestore \u2192 Rules, allow read &amp; write on the collections <b>members</b> and <b>memberRecords</b>, then reload.</div>';
    }
    if(membersError==='network'){
      return '<div class="empty-state" style="padding-top:50px;">Could not load members. Check your connection and reload.</div>';
    }
    if(!membersReady.members || !membersReady.recs){
      return '<div class="empty-state" style="padding-top:50px;">Loading\u2026</div>';
    }
    if(state.adminAuthed){
      if(state.memberEditId && getMember(state.memberEditId)) return renderMemberEdit(getMember(state.memberEditId));
      if(state.memberMode==='register') return renderMemberRegister(true);
      if(state.memberDetailId && getMember(state.memberDetailId)) return renderMemberTracker(getMember(state.memberDetailId), true);
      return renderMembersAdmin();
    }
    var me = state.memberAuthed ? getMember(state.memberAuthed) : null;
    if(me) return renderMemberTracker(me, false);
    if(state.memberMode==='register') return renderMemberRegister(false);
    if(state.memberMode==='login') return renderMemberLogin();
    return renderMemberWelcome();
  }

  /* ----- personal tracker (used by the member AND by the admin when opening a member) ----- */
  function renderMemberTracker(m, admin){
    var t = todayStr();
    var sel = state.memberDate || t;
    if(sel < m.startDate) sel = t;
    var juz = memberJuzOn(m, sel);
    var rec = memberRec(m.id, sel);
    var excl = isExcluded(sel), future = sel > t;
    var st = memberStats(m);
    var map = memberJuzMap(m);
    var last = m.anchors[m.anchors.length-1];
    var h = '';

    if(admin){
      h += '<div class="detail-header"><button class="back-btn" data-action="m-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>';
      h += '<div class="app-title" style="font-size:17px;flex:1;">'+esc(m.name)+'</div>';
      if(!excl && !future && !rec.completed) h += mWaBtn(m, juz);
      h += '<button class="btn btn-outline" style="padding:7px 14px;margin-left:8px;" data-action="m-edit" data-id="'+m.id+'">Edit</button></div>';
      var bits = [];
      if(m.phone) bits.push(esc(m.phone));
      if(m.details) bits.push(esc(m.details));
      bits.push('Joined '+esc(fmtShort(m.startDate)));
      h += '<div class="muted" style="font-size:12.5px;margin:0 0 14px 30px;">'+bits.join(' &middot; ')+'</div>';
    } else {
      h += '<div class="admin-topbar"><span class="muted" style="font-size:12.5px;font-weight:600;">Signed in as '+esc(m.name)+'</span><button class="logout-link" data-action="m-logout">Log out</button></div>';
    }

    // hero for the selected day
    var status;
    if(excl) status = 'This date was deleted \u2014 not counted';
    else if(future) status = 'Scheduled \u00b7 not due yet';
    else if(rec.completed) status = '\u2705 Completed'+(rec.completedAt ? ' \u00b7 '+fmtTime(rec.completedAt) : '');
    else if(sel===t) status = '\u23f3 Pending \u2014 your Juz for today';
    else status = 'Not recorded for this day';
    h += '<div class="hero">';
    h += '<div class="eyebrow-date">'+esc(fmtLong(sel))+'</div>';
    h += '<div class="m-hero-row"><div class="m-bigjuz"><b>'+juz+'</b><span>JUZ</span></div>';
    h += '<div class="m-hero-info"><div class="m-juz-ar">'+esc(juzName(juz))+'</div><div class="hero-sub">'+esc(status)+'</div></div></div>';
    if(!excl && !future){
      if(rec.completed) h += '<button class="m-hero-btn undo" data-action="m-undo" data-id="'+m.id+'" data-date="'+sel+'">Undo</button>';
      else h += '<button class="m-hero-btn" data-action="m-mark" data-id="'+m.id+'" data-date="'+sel+'">\u2713 Mark as Read</button>';
    }
    if(sel!==t){
      h += '<div class="viewing-banner"><span>'+(future ? 'Previewing an upcoming Juz' : 'Viewing a past day \u2014 you can still record it')+'</span><button data-action="m-today">Back to today</button></div>';
    } else {
      h += '<div class="quote-line">'+esc(quoteFor(sel))+'</div>';
    }
    h += '</div>';

    // all 30 Juz
    h += '<div class="section-title">All 30 Juz <span class="muted" style="font-size:11.5px;font-weight:600;">Rotates daily \u00b7 tap to view</span></div>';
    h += '<div class="m-grid">';
    for(var j=1;j<=30;j++){
      var info = map[j];
      var cls, tick = '';
      if(info.kind==='future') cls = 'future';
      else if(isExcluded(info.date)) cls = 'off';
      else if(memberRec(m.id, info.date).completed){ cls = 'done'; tick = '<i class="tick">\u2713</i>'; }
      else cls = info.kind==='today' ? 'today' : 'missed';
      if(info.kind==='today') cls += ' istoday';
      if(info.date===sel) cls += ' sel';
      h += '<button class="m-tile '+cls+'" data-action="m-pick" data-date="'+info.date+'" title="'+escA(juzName(j))+'">'+j+tick+'</button>';
    }
    h += '</div>';
    h += '<div class="cal-legend">';
    h += '<span><i class="legend-dot" style="background:var(--emerald)"></i>Done</span>';
    h += '<span><i class="legend-dot" style="background:var(--gold)"></i>Today</span>';
    h += '<span><i class="legend-dot" style="background:var(--amber)"></i>Missed</span>';
    h += '<span><i class="legend-dot" style="background:var(--line)"></i>Upcoming</span>';
    h += '</div>';

    // stats
    h += '<div class="section-title">Progress</div>';
    h += '<div class="stat-grid">';
    h += '<div class="stat-box"><b>'+st.done+'</b><span>Completed</span></div>';
    h += '<div class="stat-box"><b>'+st.missed+'</b><span>Missed</span></div>';
    h += '<div class="stat-box"><b>'+st.rate+'%</b><span>Completion rate</span></div>';
    h += '<div class="stat-box"><b>'+st.streak+'</b><span>Day streak</span></div>';
    h += '</div>';
    h += '<div class="muted" style="font-size:12px;margin-top:10px;">Rotation: Juz '+last.juz+' on '+esc(fmtShort(last.date))+', then the next Juz each day (set by the admin).</div>';

    // history
    h += '<div class="section-title">History</div><div class="card" style="padding:6px 14px;">';
    var days = daysBetween(m.startDate, t) + 1, shown = 0;
    for(var i=days-1;i>=0 && shown<60;i--){
      var d = addDays(m.startDate, i);
      if(isExcluded(d)) continue;
      shown++;
      var rj = memberJuzOn(m, d), rr = memberRec(m.id, d);
      var stHtml = rr.completed ? '<span class="hist-status done">\u2705 Done</span>' : (d===t ? '<span class="hist-status future">\u23f3 Pending</span>' : '<span class="hist-status miss">\u274c Missed</span>');
      var right = stHtml;
      if(admin){
        right = '<span style="display:flex;align-items:center;gap:8px;">'+stHtml+
          (rr.completed
            ? '<button class="mark-btn undo" style="padding:6px 10px;" data-action="m-undo" data-id="'+m.id+'" data-date="'+d+'">Undo</button>'
            : '<button class="mark-btn to-mark" style="padding:6px 10px;" data-action="m-mark" data-id="'+m.id+'" data-date="'+d+'">Mark</button>')+'</span>';
        h += '<div class="hist-row"><span>'+esc(fmtShort(d))+' &middot; Juz '+rj+' ('+esc(juzName(rj))+')</span>'+right+'</div>';
      } else {
        h += '<div class="hist-row" style="cursor:pointer;" data-action="m-pick" data-date="'+d+'"><span>'+esc(fmtShort(d))+' &middot; Juz '+rj+' ('+esc(juzName(rj))+')</span>'+right+'</div>';
      }
    }
    h += '</div>';
    return h;
  }

  /* ----- admin: everyone's daily progress ----- */

      h += '<div class="empty-state">No members yet.<br>People can register from this tab, or tap \u201cAdd member\u201d.</div>';

      h += '<div class="empty-state">No members match.</div>';

        h += '<div class="s-info" data-action="m-open" data-id="'+m.id+'" style="cursor:pointer;"><div class="s-name">'+esc(m.name)+'</div><div class="juz-line">'+esc(juzName(a.juz))+'</div>';

  /* ---------- actions ---------- */
  function mMsg(text, ok){
    var el = document.getElementById('mMsg');
    if(!el) return;
    el.textContent = text || '';
    el.style.color = ok ? 'var(--emerald)' : '#B44242';
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }

  function submitRegister(btn, byAdmin){
    var name = val('mName').trim().replace(/\s+/g,' ');
    var phone = val('mPhone').trim(), details = val('mDetails').trim();
    var p1 = val('mPass'), p2 = val('mPass2');
    var startJuz = byAdmin ? (parseInt(val('mJuz'),10) || 1) : 1;
    if(name.length < 2){ mMsg('Please enter your name.'); return; }
    if(nameTaken(name, null)){ mMsg('This name is already registered. Add a surname or place to make it different, or log in.'); return; }
    if(p1.length < 4){ mMsg('Password must be at least 4 characters.'); return; }
    if(p1 !== p2){ mMsg('The two passwords do not match.'); return; }
    btn.disabled = true; mMsg('Saving\u2026', true);
    var ref = doc(collection(db,'members')), salt = randSalt(), start = todayStr();
    hashPw(p1, salt).then(function(hash){
      var data = { name:name, phone:phone, details:details, salt:salt, pwHash:hash, startDate:start, anchors:[{ date:start, juz:startJuz }], createdAt:Date.now() };
      return setDoc(ref, data).then(function(){ return data; });
    }).then(function(data){
      if(!getMember(ref.id)){
        members.push({ id:ref.id, name:data.name, phone:data.phone, details:data.details, salt:data.salt, pwHash:data.pwHash, startDate:data.startDate, anchors:data.anchors, createdAt:data.createdAt });
      }
      if(byAdmin){ history.back(); return; }
      state.memberAuthed = ref.id; saveMemberAuthed(ref.id);
      state.memberMode = 'welcome'; state.memberDate = null;
      renderNow(); window.scrollTo(0,0);
    }).catch(function(err){
      console.error(err);
      btn.disabled = false;
      mMsg(err && err.code==='permission-denied' ? 'Not allowed by the database rules (add rules for \u201cmembers\u201d and \u201cmemberRecords\u201d).' : 'Could not save \u2014 check your internet connection and try again.');
    });
  }

  function submitLogin(btn){
    var key = nameKey(val('lName')), pw = val('lPass');
    if(!key || !pw){ mMsg('Enter your name and password.'); return; }
    var m = members.find(function(x){ return nameKey(x.name)===key; });
    if(!m){ mMsg('No account found with this name. Check the spelling, or register.'); return; }
    btn.disabled = true;
    hashPw(pw, m.salt).then(function(hash){
      btn.disabled = false;
      if(hash !== m.pwHash){ mMsg('Incorrect password.'); return; }
      state.memberAuthed = m.id; saveMemberAuthed(m.id);
      state.memberMode = 'welcome'; state.memberDate = null;
      renderNow(); window.scrollTo(0,0);
    });
  }

  function submitEdit(btn){
    var m = getMember(state.memberEditId);
    if(!m) return;
    var t = todayStr();
    var name = val('eName').trim().replace(/\s+/g,' ');
    if(name.length < 2){ mMsg('Please enter a name.'); return; }
    if(nameTaken(name, m.id)){ mMsg('Another member already has this name.'); return; }
    var juz = parseInt(val('eJuz'),10) || 1;
    var eff = val('eFrom') || t;
    if(eff > t) eff = t;
    if(eff < m.startDate) eff = m.startDate;
    var anchors = m.anchors.slice();
    if(memberJuzOn(m, eff) !== juz){
      anchors = anchors.filter(function(a){ return a.date < eff; });
      anchors.push({ date:eff, juz:juz });
    }
    var upd = { name:name, phone:val('ePhone').trim(), details:val('eDetails').trim(), anchors:anchors };
    var np = val('ePass');
    if(np && np.length < 4){ mMsg('New password must be at least 4 characters.'); return; }
    btn.disabled = true; mMsg('Saving\u2026', true);
    var p = Promise.resolve();
    if(np){
      var salt = randSalt();
      p = hashPw(np, salt).then(function(h){ upd.salt = salt; upd.pwHash = h; });
    }
    p.then(function(){ return updateDoc(doc(db,'members',m.id), upd); }).then(function(){
      Object.keys(upd).forEach(function(k){ m[k] = upd[k]; });
      history.back();
    }).catch(function(err){
      console.error(err); btn.disabled = false;
      mMsg('Could not save \u2014 check your internet connection and try again.');
    });
  }

  function deleteMember(id){
    var m = getMember(id);
    if(!m) return;
    if(!confirm('Delete '+m.name+'? Their account and all their recitation records will be removed permanently.')) return;
    var ops = [{ type:'delete', ref:doc(db,'members',id) }], suffix = '_'+id;
    Object.keys(memberRecs).forEach(function(k){
      if(k.slice(-suffix.length)===suffix) ops.push({ type:'delete', ref:doc(db,'memberRecords',k) });
    });
    commitOpsInChunks(ops, 400).then(function(){
      members = members.filter(function(x){ return x.id!==id; });
      state.memberEditId = null; state.memberDetailId = null;
      renderNow(); window.scrollTo(0,0);
    }).catch(function(e){ console.error(e); alert('Could not delete \u2014 check your internet connection.'); });
  }

  function exportMembersCSV(){
    var t = todayStr(), earliest = t;
    members.forEach(function(m){ if(m.startDate < earliest) earliest = m.startDate; });
    var rows = [['Date','Member','Phone','Details','Juz','Juz Name','Completed','Completed Time']];
    var days = daysBetween(earliest, t) + 1;
    for(var i=0;i<days;i++){
      var d = addDays(earliest, i);
      if(isExcluded(d)) continue;
      memberDayList(d).forEach(function(a){
        rows.push([d, a.member.name, a.member.phone, a.member.details, a.juz, juzName(a.juz), a.completed?'Yes':'No', a.completedAt ? new Date(a.completedAt).toLocaleString() : '']);
      });
    }
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell===null||cell===undefined ? '' : cell);
        if(s.indexOf(',')>-1 || s.indexOf('"')>-1 || s.indexOf('\n')>-1){ s = '"'+s.replace(/"/g,'""')+'"'; }
        return s;
      }).join(',');
    }).join('\n');
    var blob = new Blob(["\uFEFF"+csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'members-recitation-backup-'+t+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var a = el.dataset.action;
    if(a.indexOf('m-')!==0) return;
    var t = todayStr();

    if(a==='m-open-register'){ navigateTo({ memberMode:'register' }); }
    else if(a==='m-open-login'){ navigateTo({ memberMode:'login' }); }
    else if(a==='m-cancel' || a==='m-back'){ history.back(); }
    else if(a==='m-register-submit'){ submitRegister(el, el.dataset.admin==='1'); }
    else if(a==='m-login-submit'){ submitLogin(el); }
    else if(a==='m-edit-save'){ submitEdit(el); }
    else if(a==='m-delete'){ deleteMember(el.dataset.id); }
    else if(a==='m-logout'){
      saveMemberAuthed(null); state.memberAuthed = null; state.memberMode = 'welcome'; state.memberDate = null;
      renderNow(); window.scrollTo(0,0);
    }
    else if(a==='m-show-pw'){
      document.querySelectorAll('[data-pw]').forEach(function(i){ i.type = el.checked ? 'text' : 'password'; });
    }
    else if(a==='m-pick'){
      state.memberDate = (el.dataset.date===t) ? null : el.dataset.date;
      renderNow(); window.scrollTo({ top:0, behavior:'smooth' });
    }
    else if(a==='m-today'){ state.memberDate = null; renderNow(); }
    else if(a==='m-mark'){ setMemberDone(el.dataset.date, el.dataset.id, true); }
    else if(a==='m-undo'){ setMemberDone(el.dataset.date, el.dataset.id, false); }
    else if(a==='m-open'){ navigateTo({ memberDetailId:el.dataset.id, memberDate:null, memberEditId:null }); }
    else if(a==='m-edit'){ navigateTo({ memberEditId:el.dataset.id }); }
    else if(a==='m-add'){ navigateTo({ memberMode:'register' }); }
    else if(a==='m-goto'){ navigateTo({ view:'members', memberDetailId:null, memberEditId:null, memberMode:'welcome' }); }
    else if(a==='m-filter'){ state.memberFilter = el.dataset.filter; renderNow(); }
    else if(a==='m-day-prev'){ state.memberAdminDate = addDays(state.memberAdminDate || t, -1); renderNow(); }
    else if(a==='m-day-next'){
      var nd = addDays(state.memberAdminDate || t, 1);
      state.memberAdminDate = nd >= t ? null : nd; renderNow();
    }
    else if(a==='m-day-today'){ state.memberAdminDate = null; renderNow(); }
    else if(a==='m-export'){ exportMembersCSV(); }
  });

  content.addEventListener('input', function(e){
    if(e.target.id==='mSearch'){
      state.memberSearch = e.target.value; renderNow();
      var inp = document.getElementById('mSearch');
      if(inp){ inp.focus(); inp.selectionStart = inp.value.length; }
    }
  });
  content.addEventListener('change', function(e){
    if(e.target.id==='mAdminDate'){
      var v = e.target.value;
      if(v){ state.memberAdminDate = (v >= todayStr()) ? null : v; renderNow(); }
    }
  });
  content.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('m-input') && e.target.tagName!=='TEXTAREA'){
      var b = content.querySelector('[data-enter]');
      if(b && !b.disabled) b.click();
    }
  });

  /* ================= EVENTS ================= */
  document.getElementById('bottomNav').addEventListener('click', function(e){
    var btn = e.target.closest('.nav-btn');
    if(!btn) return;
    navigateTo({ view: btn.dataset.view, studentDetailId: null, memberDetailId: null, memberEditId: null, memberMode: 'welcome' });
  });

  document.getElementById('app').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;

    if(action==='mark'){ if(!isExcluded(state.selectedDate)){ setCompleted(state.selectedDate, el.dataset.id, true); render(); } }
    else if(action==='undo'){ if(!isExcluded(state.selectedDate)){ setCompleted(state.selectedDate, el.dataset.id, false); render(); } }
    else if(action==='filter'){ state.filter = el.dataset.filter; render(); }
    else if(action==='go-today'){ state.selectedDate = todayStr(); render(); }
    else if(action==='pick-date'){
      if(lpFired){ lpFired=false; } else { state.selectedDate = el.dataset.date; render(); }
    }
    else if(action==='view-day'){ state.selectedDate = el.dataset.date; state.view='home'; render(); }
    else if(action==='cal-prev'){
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; } render();
    }
    else if(action==='cal-next'){
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; } render();
    }
    else if(action==='open-student'){ navigateTo({ detailFrom: state.view, view: 'students', studentDetailId: el.dataset.id }, false); }
    else if(action==='back-students'){ history.back(); }
    else if(action==='admin-setup-save'){
      var id = document.getElementById('setupId').value.trim();
      var pass = document.getElementById('setupPass').value.trim();
      if(!id || !pass){ state.adminError='Please fill in both fields.'; render(); return; }
      saveAdminCreds(id, pass);
      state.adminAuthed = true; state.adminError=''; saveAdminAuthed(true); render();
    }
    else if(action==='admin-login'){
      var lid = document.getElementById('loginId').value.trim();
      var lpass = document.getElementById('loginPass').value.trim();
      if(lid===settings.adminId && lpass===settings.adminPassword){ state.adminAuthed=true; state.adminError=''; saveAdminAuthed(true); render(); }
      else { state.adminError='Incorrect ID or password.'; render(); }
    }
    else if(action==='admin-logout'){ state.adminAuthed=false; saveAdminAuthed(false); render(); }
    else if(action==='admin-reset-login'){
      if(confirm('This clears the current Admin ID & password so you can set new ones. Your students, records and phone numbers are not affected. Continue?')){
        saveAdminCreds('', '');
        state.adminAuthed=false; state.adminError=''; saveAdminAuthed(false); render();
      }
    }
    else if(action==='admin-save-creds'){
      var nid = document.getElementById('changeId').value.trim();
      var npass = document.getElementById('changePass').value.trim();
      if(nid && npass){ saveAdminCreds(nid, npass); render(); }
    }
    else if(action==='admin-save-basejuz'){
      var bj = parseInt(document.getElementById('baseJuzInput').value, 10);
      var maxN = students.length || 30;
      if(!bj || bj<1 || bj>maxN){ alert('Please enter a Juz number between 1 and '+maxN+'.'); return; }
      saveBaseJuz(bj);
    }
    else if(action==='admin-save-programstart'){
      var psv = document.getElementById('programStartInput').value;
      if(!psv){ alert('Please pick a date.'); return; }
      saveProgramStart(psv);
    }
    else if(action==='export-csv'){ exportDataCSV(); }
    else if(action==='fix-duplicates'){ fixDuplicateStudents(); }
    else if(action==='share-pdf'){
      var rd = document.getElementById('reportDateInput').value || todayStr();
      generateAndSharePdf(rd);
    }
    else if(action==='share-text'){
      var rdt = document.getElementById('reportDateInput').value || todayStr();
      shareDayText(rdt);
    }
  });

  /* ---------- Long-press a calendar date (3s) to delete/restore it ---------- */
  var lpTimer = null, lpFired = false;
  function clearLP(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } }
  function handleDateLongPress(dateStr){
    if(!state.adminAuthed) return;
    if(isFuture(dateStr)) return;
    if(isExcluded(dateStr)){
      if(confirm('Restore '+fmtShort(dateStr)+'? It will count normally again and can be marked.')){ restoreDate(dateStr); }
    } else {
      if(confirm('Delete '+fmtShort(dateStr)+'? No one will be able to mark recitation for this date, and it won\u2019t count as pending.')){ excludeDate(dateStr); }
    }
  }
  document.getElementById('app').addEventListener('contextmenu', function(e){
    if(e.target.closest('[data-longpress-date]')) e.preventDefault();
  });
  document.getElementById('app').addEventListener('pointerdown', function(e){
    var el = e.target.closest('[data-longpress-date]');
    if(!el || !el.dataset.longpressDate) return;
    var dateStr = el.dataset.longpressDate;
    clearLP();
    lpTimer = setTimeout(function(){ lpFired = true; handleDateLongPress(dateStr); }, 3000);
  });
  ['pointerup','pointercancel','pointerleave','pointermove'].forEach(function(evt){
    document.getElementById('app').addEventListener(evt, clearLP);
  });

  content.addEventListener('input', function(e){
    if(e.target.id==='searchInput'){ state.search = e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').selectionStart = document.getElementById('searchInput').value.length; }
    else if(e.target.dataset && e.target.dataset.action==='rename'){
      var s = students.find(function(x){ return x.id===e.target.dataset.id; });
      if(s){ s.name = e.target.value; updateDoc(doc(db,'students', s.id), { name: e.target.value }).catch(function(err){ console.error(err); }); }
    }
    else if(e.target.dataset && e.target.dataset.action==='rename-phone'){
      var s2 = students.find(function(x){ return x.id===e.target.dataset.id; });
      if(s2){ saveStudentPhone(s2.id, e.target.value); }
    }
  });
  content.addEventListener('change', function(e){
    if(e.target.dataset && (e.target.dataset.action==='rename' || e.target.dataset.action==='rename-phone')){ render(); }
  });

  content.innerHTML = '<div class="empty-state" style="padding-top:60px;">Connecting\u2026</div>';
})();
</script>
</body>
</html>
